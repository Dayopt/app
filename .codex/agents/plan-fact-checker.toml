name = "plan-fact-checker"
description = "plan 内の path、symbol、table、API、件数、設定に関する事実主張を current source と照合する。/plan-review から plan-critic と並列利用する read-only fact checker。"
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
`.agents/roles/plan-fact-checker.md` を最初に全文読み、その正本だけに従って照合する。この adapter に role 本文を複製しない。Main / user に依頼されても write-capable tool / command を試行せず、MCP tool を呼ばない。実行確認が必要なら Main が実行すべき command を返す。"""

[apps._default]
enabled = false
