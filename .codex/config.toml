[mcp_servers.context7]
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]
command = "npx"

[mcp_servers.eagle]
url = "http://127.0.0.1:41596/mcp"

[mcp_servers.sentry]
args = [
    "-y",
    "@sentry/mcp-server@latest",
]
command = "npx"
env_vars = ["SENTRY_ACCESS_TOKEN"]

[mcp_servers.supabase-local]
url = "http://127.0.0.1:54321/mcp"

[mcp_servers.github]
command = "op"
args = [
    "run",
    "--no-masking",
    "--",
    "github-mcp-server",
    "stdio",
]

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "op://Dayopt-Shared/github-mcp-pat/credential"

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.storybook]
url = "http://localhost:6006/mcp"

[mcp_servers.supabase]
command = "op"
args = [
    "run",
    "--no-masking",
    "--",
    "npx",
    "-y",
    "@supabase/mcp-server-supabase@latest",
    "--read-only",
    "--project-ref=yvglwblxrnrenfifsnje",
]

[mcp_servers.supabase.env]
SUPABASE_ACCESS_TOKEN = "op://Dayopt-Staging/supabase/SUPABASE_ACCESS_TOKEN"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
