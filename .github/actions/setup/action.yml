name: Setup workspace
description: Configure Node.js, restore the pnpm store cache, and install workspace dependencies.

inputs:
  node-version:
    description: Node.js version used by the workflow.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    # setup-node resolves the pnpm store path while restoring its cache. Put the
    # Corepack shim in a stable directory that remains on PATH after Node changes.
    - name: Prepare Corepack for pnpm cache
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/corepack-bin"
        corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
        echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
