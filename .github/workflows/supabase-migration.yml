# ============================================================
# Supabase Migration Workflow
# ============================================================
# 運用モデル: 単一 project 運用（ローンチ前の簡易構成）
#
# プロジェクト: yvglwblxrnrenfifsnje（旧 Staging を Production として使用）
#
# 将来: Pro plan へ移行して GitHub integration を有効化すると、
#   この workflow 自体が不要になる（integration が preview branch / main merge
#   両方で migration を自動適用する）。
#
# 移行計画:
#   1. Production を Pro plan へアップグレード
#   2. GitHub integration を Production project に接続
#   3. persistent `staging` branch を作成
#   4. この workflow を削除（integration が代替）
#
# 詳細: docs/development/migration-checklist.md / .claude/skills/supabase/SKILL.md
# ============================================================

name: 🗃️ Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-production:
    name: 🗃️ Push Migrations to Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🏗️ Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # GitHub API anonymous rate limit で `latest` lookup が 404 になることがあるため version を pin
          version: 2.99.0

      - name: 🔗 Link to Production
        run: supabase link --project-ref yvglwblxrnrenfifsnje

      - name: 🧪 Dry Run
        run: supabase db push --dry-run

      - name: 🚀 Push Migrations
        run: supabase db push
