name: CI

on:
  pull_request:
    branches: [main]
    # コード実行に影響しない path だけの変更では CI を走らせない。
    # paths-ignore は「変更ファイルが *全て* 該当した時だけ skip」なので、
    # コードが 1 ファイルでも混ざれば通常どおり 4 job すべて走る。
    #
    # 意図的に含めていないもの:
    # - apps/web/content/** … 公開 MDX。web build / E2E の検証対象
    # - **/*.md のような広いパターン … 上を巻き込むため使わない
    # - .claude/**, .codex/** の *.md 以外 … hooks の .sh や設定 JSON が含まれる
    #
    # docs のみの PR でも Docs Guard（gitleaks / secrets:check / docs:check）と
    # Production Config Audit は paths フィルタを持たないので従来どおり走る。
    paths-ignore:
      - 'docs/**'
      - '.claude/**/*.md'
      - '.codex/**/*.md'
      - '.agents/**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  # main への push では走らせない。branch:finish が「branch が main 最新を
  # 含み、その状態で CI green」をマージ前に強制するため（up-to-date gate）、
  # マージ後の main は常に PR で検証済みの tree と一致する。
  # 手動で main を検証したい時は workflow_dispatch を使う。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# private repo の Actions 課金は job ごとに 1 分単位で切り上げられるため、
# job 数を絞り checkout + setup の重複を減らす構成にしている。
# 実行コマンドは旧 11 job 構成と同一で、検証内容は減らしていない。
jobs:
  static:
    name: "\U0001F50D Static Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      # 独立した static チェックを 1 step 内の shell background lane で並列実行する（#1422）。
      # 2026-06-25 GA の native `parallel` 構文は hosted runner 未対応（workflow parse error）
      # だったため、確実に動く `&` / `wait` 方式を採用。install は共有し、重い ESLint / knip /
      # typecheck を個別 lane に分離。lane ごとに log を退避し ::group:: で表示して失敗箇所を明確にする。
      - name: Static checks (parallel lanes)
        run: |
          set +e # rc は lane ごとに手動集計するため errexit は使わない

          (pnpm lint) >/tmp/lane-eslint.log 2>&1 &
          pid_eslint=$!

          (
            set -o pipefail
            pnpm quality:deadcode:ci 2>&1 | tee /tmp/knip-output
            rc=${PIPESTATUS[0]}
            head -3 /tmp/knip-output >>"$GITHUB_STEP_SUMMARY"
            exit "$rc"
          ) >/tmp/lane-knip.log 2>&1 &
          pid_knip=$!

          (
            set -e
            pnpm check:static
          ) >/tmp/lane-rest.log 2>&1 &
          pid_rest=$!

          (pnpm typecheck) >/tmp/lane-typecheck.log 2>&1 &
          pid_typecheck=$!

          wait "$pid_eslint"; rc_eslint=$?
          wait "$pid_knip";   rc_knip=$?
          wait "$pid_rest";   rc_rest=$?
          wait "$pid_typecheck"; rc_typecheck=$?

          echo "::group::lane: ESLint (rc=$rc_eslint)"; cat /tmp/lane-eslint.log; echo "::endgroup::"
          echo "::group::lane: Dead code (rc=$rc_knip)"; cat /tmp/lane-knip.log; echo "::endgroup::"
          echo "::group::lane: Boundaries/format/i18n/taxonomy (rc=$rc_rest)"; cat /tmp/lane-rest.log; echo "::endgroup::"
          echo "::group::lane: TypeScript (rc=$rc_typecheck)"; cat /tmp/lane-typecheck.log; echo "::endgroup::"

          if [ "$rc_eslint" -ne 0 ] || [ "$rc_knip" -ne 0 ] || [ "$rc_rest" -ne 0 ] || [ "$rc_typecheck" -ne 0 ]; then
            echo "::error::static lane failed (eslint=$rc_eslint knip=$rc_knip rest=$rc_rest typecheck=$rc_typecheck)"
            exit 1
          fi

  product:
    name: "\U0001F4E6 Build & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build:packages

      - name: Verify Product and Web Production contracts with safe dummy values
        run: |
          pnpm exec vitest run --config vitest.scripts.config.ts scripts/production-config-audit.test.ts scripts/production-release.test.ts scripts/__tests__/release-workflow-contract.test.ts
          pnpm --dir apps/product exec vitest --project unit run production-build-gate.test.mjs
          pnpm --dir apps/web exec vitest run production-build-gate.test.mjs

      # coverage は計測しない。閾値 gate（vitest の coverage.thresholds）も
      # artifact upload も無いため、istanbul 計装のコストをかけて作ったレポートは
      # runner 破棄とともに捨てられていた。実行するテストは完全に同一
      # （どちらも --project unit run。実測 243 files / 2278 tests で一致）。
      # 計装のオーバーヘッドはローカル実測で 13 秒（9.5%）なので削減は 0-1 課金分。
      # 主眼はコストより「誰も読まないレポートを作るのをやめる」こと。
      # coverage を見たい時はローカルで pnpm test:coverage を実行する。
      - name: Product unit tests
        run: pnpm --filter @dayopt/product test:run

      - name: Web unit tests
        run: pnpm test:web

      - name: Shared i18n unit tests
        run: pnpm --filter @dayopt/i18n test:run

      - name: Shared observability unit tests
        run: pnpm --filter @dayopt/observability test:run

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: apps/product/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/product/src/**/*.{ts,tsx}') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Check for leaked secrets in client bundle
        run: |
          PATTERN="SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|RECOVERY_CODE_PEPPER|SENTRY_AUTH_TOKEN|UPSTASH_REDIS_REST_TOKEN|RESEND_API_KEY|RECAPTCHA_SECRET_KEY|SLACK_BILLING_WEBHOOK|GITHUB_TOKEN|sk_live_|sk_test_|whsec_|ghp_"
          if grep -rqE "$PATTERN" apps/product/.next/static/ --include="*.js" 2>/dev/null; then
            echo "::error::Secret pattern found in client bundle!"
            grep -rE "$PATTERN" apps/product/.next/static/ --include="*.js"
            exit 1
          fi
          echo "✓ No secrets found in client bundle"

      - name: Compute bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --output=.next/diagnostics/budget-result.json

      - name: Report JS bundle budget
        run: |
          if [ -f apps/product/.next/diagnostics/budget-result.json ]; then
            echo "## 📦 Bundle Size Budget Report" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const r = require('./apps/product/.next/diagnostics/budget-result.json');
              const s = r.summary;
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Login page (gzip) | ' + s.loginGzipKB + ' KB |');
              console.log('| Smallest route (gzip) | ' + s.smallestGzipKB + ' KB |');
              console.log('| Largest route (gzip) | ' + s.largestGzipKB + ' KB |');
              console.log('| CSS total (gzip) | ' + r.css.gzipKB + ' KB |');
              console.log('| Routes over budget | ' + s.overCount + ' / ' + s.totalRoutes + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📦 Bundle Size" >> "$GITHUB_STEP_SUMMARY"
            echo "budget-result.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check CSS bundle size
        run: pnpm size

  e2e:
    name: "\U0001F3AD E2E Tests"
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        run: pnpm --dir apps/product exec playwright test --project="chromium"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/product/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: apps/product/test-results/
          retention-days: 7

  web:
    name: "\U0001F310 Web Build & E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.{ts,tsx}', 'apps/web/content/**/*.{md,mdx,json}') }}
          restore-keys: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build web
        run: pnpm build:web

      - name: Install Playwright browser
        run: pnpm --filter @dayopt/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run web E2E tests
        run: pnpm --filter @dayopt/web test:e2e:smoke

      - name: Upload web report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload web test results on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-test-results
          path: apps/web/test-results/
          retention-days: 7
