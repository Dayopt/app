name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1 (~2 min) ─────────────────────────────────
  lint:
    name: "\U0001F50D ESLint & Prettier"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # 独立した lint チェックを 1 step 内の shell background lane で並列実行する（#1422）。
      # 2026-06-25 GA の native `parallel` 構文は hosted runner 未対応（workflow parse error）
      # だったため、確実に動く `&` / `wait` 方式を採用。install は共有し、重い ESLint / knip を
      # 個別 lane に分離。lane ごとに log を退避し ::group:: で表示して失敗箇所を明確にする。
      - name: Lint checks (parallel lanes)
        run: |
          set +e # rc は lane ごとに手動集計するため errexit は使わない

          (pnpm lint) >/tmp/lane-eslint.log 2>&1 &
          pid_eslint=$!

          (
            set -o pipefail
            pnpm quality:deadcode:ci 2>&1 | tee /tmp/knip-output
            rc=${PIPESTATUS[0]}
            head -3 /tmp/knip-output >>"$GITHUB_STEP_SUMMARY"
            exit "$rc"
          ) >/tmp/lane-knip.log 2>&1 &
          pid_knip=$!

          (
            set -e
            pnpm lint:boundaries
            pnpm exec prettier --check "apps/product/src/**/*.{ts,tsx,js,jsx,json,md}"
            pnpm exec prettier --check "package.json" "packages/*/package.json" "apps/*/package.json" "docs/**/*.md"
            pnpm license:check
            pnpm lint:i18n
            pnpm storybook:taxonomy
          ) >/tmp/lane-rest.log 2>&1 &
          pid_rest=$!

          wait "$pid_eslint"; rc_eslint=$?
          wait "$pid_knip";   rc_knip=$?
          wait "$pid_rest";   rc_rest=$?

          echo "::group::lint lane: ESLint (rc=$rc_eslint)"; cat /tmp/lane-eslint.log; echo "::endgroup::"
          echo "::group::lint lane: Dead code (rc=$rc_knip)"; cat /tmp/lane-knip.log; echo "::endgroup::"
          echo "::group::lint lane: Boundaries/format/i18n/taxonomy (rc=$rc_rest)"; cat /tmp/lane-rest.log; echo "::endgroup::"

          if [ "$rc_eslint" -ne 0 ] || [ "$rc_knip" -ne 0 ] || [ "$rc_rest" -ne 0 ]; then
            echo "::error::lint lane failed (eslint=$rc_eslint knip=$rc_knip rest=$rc_rest)"
            exit 1
          fi

  typecheck:
    name: "\U0001F524 TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  packages-build:
    name: "\U0001F4E6 Packages Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

  # ── Stage 2 (~3 min) ─────────────────────────────────
  test:
    name: "\U0001F9EA Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, packages-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: "\U0001F3D7\uFE0F Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, packages-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: apps/product/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/product/src/**/*.{ts,tsx}') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Check for leaked secrets in client bundle
        run: |
          PATTERN="SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|RECOVERY_CODE_PEPPER|SENTRY_AUTH_TOKEN|UPSTASH_REDIS_REST_TOKEN|RESEND_API_KEY|RECAPTCHA_SECRET_KEY|SLACK_BILLING_WEBHOOK|GITHUB_TOKEN|sk_live_|sk_test_|whsec_|ghp_"
          if grep -rqE "$PATTERN" apps/product/.next/static/ --include="*.js" 2>/dev/null; then
            echo "::error::Secret pattern found in client bundle!"
            grep -rE "$PATTERN" apps/product/.next/static/ --include="*.js"
            exit 1
          fi
          echo "✓ No secrets found in client bundle"

      - name: Compute bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --output=.next/diagnostics/budget-result.json

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-diagnostics
          path: |
            apps/product/.next/diagnostics/budget-result.json
            apps/product/.next/static/chunks/*.css
          retention-days: 1

  web-build:
    name: "\U0001F310 Web Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, packages-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.{ts,tsx}', 'apps/web/content/**/*.{md,mdx,json}') }}
          restore-keys: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build web
        run: pnpm build:web

  bundle-size:
    name: "\U0001F4E6 Bundle Size"
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Download build diagnostics
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-diagnostics
          path: apps/product/.next

      - name: Report JS bundle budget
        run: |
          if [ -f apps/product/.next/diagnostics/budget-result.json ]; then
            echo "## 📦 Bundle Size Budget Report" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const r = require('./apps/product/.next/diagnostics/budget-result.json');
              const s = r.summary;
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Login page (gzip) | ' + s.loginGzipKB + ' KB |');
              console.log('| Smallest route (gzip) | ' + s.smallestGzipKB + ' KB |');
              console.log('| Largest route (gzip) | ' + s.largestGzipKB + ' KB |');
              console.log('| CSS total (gzip) | ' + r.css.gzipKB + ' KB |');
              console.log('| Routes over budget | ' + s.overCount + ' / ' + s.totalRoutes + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📦 Bundle Size" >> "$GITHUB_STEP_SUMMARY"
            echo "budget-result.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check CSS bundle size
        run: pnpm size

  # ── Stage 3 (~3 min) ─────────────────────────────────
  e2e:
    name: "\U0001F3AD E2E Tests"
    runs-on: ubuntu-latest
    needs: [build]
    environment: development
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        run: pnpm --dir apps/product exec playwright test --project="chromium"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/product/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: apps/product/test-results/
          retention-days: 7

  # ── Gate ──────────────────────────────────────────────
  quality-gate:
    name: "\U0001F6AA Quality Gate"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, packages-build, test, build, web-build, bundle-size, e2e]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.packages-build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.web-build.result }}" != "success" ] || \
             [ "${{ needs.bundle-size.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
