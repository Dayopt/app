name: CI

# CI ファイル統合（#2483 Phase 1）: 旧 ci.yml（gate/static/unit）+ docs-guard.yml
# （secret scan + docs 整合）+ integration.yml（migration-safety の静的スキャン +
# 層 3 撤去後に affected な PR だけ走る integration/RLS）を 1 ファイルへ統合した。
# 実行本体は scripts/ci/check.mjs（「薄い呼び出し層 + scripts 実体」再編）。
#
# job は static → test の 2 本直列（fail-fast で課金を守る。static が落ちたら
# test は走らない）。affected 判定（docs-only skip・integration の DB-touch 判定）
# は scripts/ci/impact.mjs が正本で、static job が 1 回だけ判定して job output へ
# 出し、test job はそれを再利用する（2 job で gh api を 2 回叩いて結果がずれる
# リスクを避けるため）。

on:
  pull_request:
    branches: [main]
    # **`ready_for_review` を明示的に含める。** 既定の types は
    # `opened / synchronize / reopened` だけで ready_for_review を含まないため、
    # これが無いと draft → ready の変換で CI が再発火しない
    # （2026-08-03、PR #1810 で実測済みの罠）。
    types: [opened, synchronize, reopened, ready_for_review]
  # main への push では走らせない。branch:finish が「branch が main 最新を
  # 含み、その状態で CI green」をマージ前に強制するため（up-to-date gate）、
  # マージ後の main は常に PR で検証済みの tree と一致する。
  # 手動で main を検証したい時は workflow_dispatch を使う。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read は static job の impact 判定（PR の変更ファイル一覧取得）に、
# issues: write は test job の migration safety のラベル付与に要る（job 単位で
# 追加宣言する。ここでは最小に絞る）。
permissions:
  contents: read
  pull-requests: read

# ── draft 中は CI を完全に skip する（2026-08-28、#2483 Phase 1。User 裁可）──
# 検査網が要るのは境界を越える瞬間（ready = 指揮台の時間を使う / merge = main に
# 入る）だけで、draft はレーンの私的作業場。機械 gate は pre-commit / pre-push
# フック（affected typecheck/lint + typecheck:scripts/test:scripts/format:check、
# #2359）が担う。**意図的な変更点は 2 つ**: (1) gitleaks が draft 中は走らない
# （旧 docs-guard.yml は draft 判定を持たず全 pull_request イベントで走っていた。
# pre-commit の gitleaks が一次防衛、CI（ready 後）は backstop という位置づけへ
# 変える）。(2) migration safety（破壊的 migration の静的スキャン）も draft 中は
# 走らない（旧 integration.yml の同ロジックは draft guard を持たず DB 不要の
# 静的スキャンとして常時実行していた。内製クロスレビュー risk-reviewer 指摘、
# P2、PR #2484）。それ以外の検査内容は削っていない。
#
# `draft != true` と書く（`== false` ではない）: workflow_dispatch では
# pull_request context が無く null になるため、`== false` だと手動実行で
# 全 job が skip される。
jobs:
  static:
    name: "\U0001F50D Static Checks"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.run.outputs.docs_only }}
      product_unit: ${{ steps.run.outputs.product_unit }}
      integration: ${{ steps.run.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks の diff scan と docs:check の append-only guard が
          # base ref との差分を見るため full history が必要（旧 docs-guard.yml と同じ）
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run static checks
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/check.mjs static

  test:
    name: "\U0001F4E6 Unit Tests"
    needs: static
    # `always()` を付けるのは、static job 自体が落ちた時に下流が skip されると
    # 「検証なしで required check が success」になる（fail open）ため。always()
    # なら static 失敗時も評価され、空の output は `!= 'true'` で実行側に倒れる。
    if: always() && github.event.pull_request.draft != true && needs.static.result == 'success' && needs.static.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # ── Supabase の起動は affected な PR（DB を触る変更）だけに絞る ──
      # 起動しない PR では test:integration / rls:snapshot:check 自体を
      # check.mjs 側が skip するため、ここで CLI setup + start をまるごと
      # 省略してコストを避ける（旧 integration.yml の per-PR 撤去〈#2269〉の
      # 意図を、affected 判定つきの per-PR 実行として復活させたもの）。
      #
      # `!= 'false'`（`== 'true'` ではない）: check.mjs の shouldRunIntegrationTests
      # と同じ fail-closed 方向（判定不能なら実行する）に揃える。output が
      # 空になる経路は `needs.static.result == 'success'` 要求で現状塞がれて
      # いるが、guard の向きが 2 箇所で食い違っていると将来の配線変更で
      # サイレントに壊れる（内製クロスレビュー risk-reviewer 指摘、P3）。
      - id: supabase-version
        if: needs.static.outputs.integration != 'false'
        run: |
          version=$(node -p "require('./package.json').devDependencies.supabase")
          if [ "$version" = "undefined" ] || [ -z "$version" ]; then
            echo "::error::supabase CLI version の抽出に失敗しました（root package.json の devDependencies.supabase を確認してください）: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        if: needs.static.outputs.integration != 'false'
        with:
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        if: needs.static.outputs.integration != 'false'
        run: supabase start

      - name: Get Supabase status
        id: supabase
        if: needs.static.outputs.integration != 'false'
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Run tests (unit + affected integration/RLS + migration safety)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCT_UNIT: ${{ needs.static.outputs.product_unit }}
          INTEGRATION_AFFECTED: ${{ needs.static.outputs.integration }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
          USE_LOCAL_DB: 'true'
          NODE_ENV: test
          CI: true
        run: node scripts/ci/check.mjs test

      - name: Stop Supabase
        if: always() && needs.static.outputs.integration != 'false'
        run: supabase stop
