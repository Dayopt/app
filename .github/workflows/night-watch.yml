name: Night Watch

# 計測夜勤（night-watch）を Claude Routine から GitHub Actions cron へ移植した
# もの（#2367）。夜勤 Routine（Claude Code Cloud の scheduled trigger、毎日
# 05:00 JST）は、Anthropic cloud sandbox のプロキシが repo スコープの GitHub
# REST API を 403 で遮断する構造的障害（#2216）を抱え、登録以来一度も正常
# 完走していなかった。夜勤は設計上「判定のみ・裁量なし」（SKILL.md §実行
# 内容）で model の裁量を使っていないため、model を実行系から完全に外し、
# 判定ロジックを scripts/night-watch/run-all.mjs へ code 化した。
#
# 判定規約の正本は .claude/skills/night-watch/SKILL.md §自動パート。ここに
# 判定ロジックを複製しない — この workflow が扱うのは実行環境の配線
# （secrets・permissions・依存ツールの導入）だけ。
#
# 旧設計の「権限の3層防御」（token scope・allowed_tools・hook allowlist、
# LLM agent が誤って/騙されて過剰権限を使う class への対策）は、model が
# 実行系にいない本設計では前提が消えている。この `permissions:` ブロックが
# その後継 — GitHub がジョブ開始前に server 側で GITHUB_TOKEN の権限を
# 強制するため、同じ非敵対的な script 自身によるランタイム自己検証より
# 本質的に強い。

on:
  schedule:
    # 04:00 JST（#2367、朝の蒸留層〈Haiku、05:00 JST 固定〉から逆算した配置。
    # 機械層は 04:00 完了目標に置き、蒸留層が 05:00 に出力を読める状態にする）。
    # heavy-post-merge（nightly 03:00 JST）・integration（nightly 03:30 JST）
    # の結果を night-watch が読む（heavy-red / integration-red check）ため、
    # それらより後に完了するよう配置してある（CI 完了後 60/30 分の相対配置は
    # 前倒し前と同じ）。
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: night-watch
  # 起票・コメント投稿は alert-issue.mjs の dedup（title prefix + label）と
  # board-issue.mjs の title 冪等 skip が守るため、途中終了させて中途半端な
  # 状態を残すより、次の起動を待たせる方が安全（storage-backup-export.yml と
  # 同じ判断）。
  cancel-in-progress: false

# GITHUB_TOKEN の権限をここで明示的に最小化する。permissions ブロックを
# 明示した時点で未指定 key は none に落ちる。issues: write は起票・
# コメント・close（board-issue.mjs / alert-issue.mjs / run-log.mjs）、
# contents: read は checkout、actions: read は heavy-red / integration-red
# の `gh run list`、pull-requests: read は DoD 候補選定の
# `gh pr list --search`（Step 4）に必要。write 系（contents:write /
# pull-requests:write / administration 等）は一切持たせない。
permissions:
  issues: write
  contents: read
  actions: read
  pull-requests: read

jobs:
  night-watch:
    name: Night Watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # secrets 未投入（登録直後の状態）でも workflow 自体は main へマージ・
      # cron 起動できるようにしつつ、無音成功にはしない
      # （storage-backup-export.yml と同じ idiom）。値そのものは echo しない。
      - name: 必須 secrets の存在を確認（fail closed）
        env:
          NIGHT_WATCH_DEPENDABOT_TOKEN: ${{ secrets.NIGHT_WATCH_DEPENDABOT_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing=()
          for key in NIGHT_WATCH_DEPENDABOT_TOKEN SENTRY_AUTH_TOKEN; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::未設定の GitHub Secrets があります: ${missing[*]}"
            echo "::error::docs/operations/night-watch.md の手順に従って登録してください（#2367）。"
            exit 1
          fi
          echo "必須 secrets はすべて設定されています。"

      # Sentry CLI（cli.sentry.dev、getsentry/cli リポジトリ）を pin +
      # checksum 検証で導入する。org の Actions 許可リストの制約から公式
      # `curl | bash` installer（unpinned・checksum 検証無し）は使わず、
      # docs-guard.yml の gitleaks / storage-backup-export.yml の rclone と
      # 同じ idiom（バイナリ直接取得 + sha256 検証）にする。
      #
      # digest は GitHub の Release Assets API が計算したもの（アップロード
      # 時にサーバー側で算出され、アップロード後は不変。転送時の破損 /
      # MITM を検出する）を実測して固定した（2026-08-25）:
      #   gh api repos/getsentry/cli/releases/tags/<VERSION> \
      #     --jq '.assets[] | select(.name=="sentry-linux-x64") | .digest' \
      #     | sed 's/^sha256://'
      # `releases/latest` ではなく `releases/tags/<VERSION>` で pin 対象の
      # version を明示すること（`latest` は将来のリリースで別バイナリを指す）。
      # API の digest は `sha256:<hex>` 形式なので `sed` で prefix を落として
      # から NIGHT_WATCH_CLI_CHECKSUM_SHA256 へ入れる（push 前反証レビュー
      # risk-reviewer 指摘、low。付けたまま貼ると sha256sum -c が必ず失敗する
      # — fail-closed なので安全側の壊れ方だが、次の version bump 時に迷う）。
      #
      # env 変数名は意図的に「SENTRY」を含めない（`NIGHT_WATCH_CLI_*`）。
      # gitleaks の `sentry-access-token` ルールは変数名が SENTRY を含み
      # かつ値が hex 文字列に見える行を誤検知する（checksum は実際の secret
      # ではないが gitleaks には区別できない）。`.gitleaksignore` の
      # fingerprint 方式は CI が pin する gitleaks 8.9.0 では未サポート
      # （`Fingerprint` フィールド自体が存在しない、より新しいバージョンの
      # 機能）と実測確認済みのため、値ではなく変数名側でルールの
      # マッチ条件を外す設計にした。
      - name: Sentry CLI をインストール（pin + checksum 検証）
        env:
          NIGHT_WATCH_CLI_VERSION: '0.43.0'
          NIGHT_WATCH_CLI_CHECKSUM_SHA256: '20ac31a2b303b474f770175efd8c24c5c3315c389686dffaf5e439789670c225'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/sentry" \
            "https://github.com/getsentry/cli/releases/download/${NIGHT_WATCH_CLI_VERSION}/sentry-linux-x64"
          echo "${NIGHT_WATCH_CLI_CHECKSUM_SHA256}  $HOME/.local/bin/sentry" | sha256sum -c -
          chmod +x "$HOME/.local/bin/sentry"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sentry --version

      # NIGHT_WATCH_DEPENDABOT_TOKEN / SENTRY_AUTH_TOKEN はこの step にしか
      # 渡さない。run-all.mjs は起動直後にこの 2 つを process.env から捕捉して
      # 削除し、以降に spawn する pnpm 系コマンド（docs:check 等、サードパーティ
      # 依存コードを大量実行する）から見えなくする（run-all.mjs 冒頭コメント
      # 参照）。GH_TOKEN（github.token）は上記 permissions で既に最小権限化
      # されているため、他コマンドから見えても許容する。
      - name: night-watch Step 1〜5 を実行
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHT_WATCH_DEPENDABOT_TOKEN: ${{ secrets.NIGHT_WATCH_DEPENDABOT_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/night-watch/run-all.mjs
