name: Quality Dashboard

on:
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Collect quality metrics
        run: npm run quality:collect -- --skip=a11y

      - name: Commit snapshot
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add quality-reports/
          git diff --staged --quiet || git commit -m "chore(quality): 週次品質メトリクス更新"
          git push
