name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  statuses: read

# Production公開はProduction Release workflow（promote.yml）の手動 dispatch がpromoteで行う
# （mainマージでは自動起動しない、2026-08-20 #2268）。
# このワークフローはGitHub Releaseの作成のみを担当する。
# タグはpromoteと観察が終わった後の証跡であり、デプロイトリガーではない。

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # 未設定だと GitHub 既定の 360 分が上限になる。実測は数十秒なので、
    # ハングした時の課金を切り上げる目的で短い上限を置く。
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      # 未promoteのSHAへタグを打つと、Releaseだけが先行して証跡が実態とずれる。
      - name: Verify the tagged commit is live in Production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 既定 shell は `bash -e` で pipefail が無い。gh が失敗しても head は 0 を
          # 返すため、パイプをやめて 2 段に分ける。
          set -o pipefail
          statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
            --jq '.statuses[] | select(.context == "Production Release") | .state')
          state=$(printf '%s\n' "$statuses" | head -n 1)
          if [ "$state" != "success" ]; then
            echo "::error::Production Release has not succeeded for this commit (state: ${state:-missing})."
            echo "::error::Promote and observe Production first, then re-push the tag."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.0
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Release ${{ steps.version.outputs.version }} created successfully!"
          echo "🔗 View at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to create release ${{ steps.version.outputs.version }}"
          echo "Please check the workflow logs and create the release manually if needed."
