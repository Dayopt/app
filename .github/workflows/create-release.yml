name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# デプロイはmainマージ時にVercelが自動実行するため、
# このワークフローはGitHub Releaseの作成のみを担当する。
# タグはバージョン記録用であり、デプロイトリガーではない。

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Release ${{ steps.version.outputs.version }} created successfully!"
          echo "🔗 View at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to create release ${{ steps.version.outputs.version }}"
          echo "Please check the workflow logs and create the release manually if needed."
