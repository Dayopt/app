name: AI Review

# 実装と相関しない外部モデル（非 Anthropic 系）に、危険クラスの diff だけを見せる。
# 全 PR は対象にしない。style / 設計の好みは決定論ゲート（CI）と内部レビューの領分で、
# ここが見るのは「沈黙して失敗する」クラスだけ。契約は scripts/ai-review/prompt.md。
#
# paths は scripts/ai-review/review.ts の DANGEROUS_PATH_PATTERNS と対応させる
# （contract test で固定。片方だけ広げると、走らない or 走って何も見ない状態になる）。
#
# **pull_request ではなく pull_request_target を使う。** GEMINI_API_KEY（課金付き）と
# pull-requests: write を持つ job で PR の code を実行しないため。pull_request は
# workflow ファイル自体を PR の merge commit から読む（GitHub docs:
# "runs the workflow file from the merge commit of the pull request"）ので、
# 本ファイルを書き換えた PR は secret をそのまま持ち出せる。scripts/ai-review/ だけ
# base 版に差し替えても 1 行で迂回される。pull_request_target なら workflow は
# default branch のものが使われ（"the workflow file itself still comes from the
# default branch"）、checkout も base revision に固定できる。
# 同型の先行実装は production-config-audit.yml。経緯は
# docs/engineering/log/2026-07-30-ai-review-trusted-base.md。
on:
  pull_request_target:
    branches: [main]
    # **labeled は入れない。** ラベル付与で再発火させると、同じ head SHA に 2 本目の
    # run が積まれる。`gh pr view --json statusCheckRollup` は同名 check を畳まないため
    # （2026-07-30 に PR #1765 で実測: check-runs 18 件のうち 8 名前が重複、rollup 21 件
    # に対し `gh pr checks` は 13 行）、`finish-branch.sh` は古い run の failure を
    # 数え続ける。つまりラベルを付けても赤が消えず、逃げ道として機能しない。
    # ラベルは**次の push の run**で効く（新しい SHA なら rollup が綺麗になる）。
    #
    # `ready_for_review` を入れる代わりに、job 側で draft を skip する。両方を素通しにすると
    # 「draft で open → ready にする」で同じ head SHA に 2 本目の run が積まれ、上と同じ
    # 経路で古い run が数えられ続ける。draft 中は skip し、ready になった時に 1 回だけ走る。
    # draft の反復 push に Gemini の課金を使わない副次効果もある。
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # データ分離・データ損失
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'apps/product/src/lib/database/**'
      - 'apps/product/src/lib/supabase/**'
      # 認証・セッション・認可
      - 'apps/product/src/features/auth/**'
      - 'apps/product/src/lib/auth/**'
      - 'apps/product/src/lib/oauth-server/**'
      - 'apps/product/src/lib/security/**'
      - 'apps/product/src/lib/safe-redirect.ts'
      - 'apps/product/src/proxy.ts'
      # サーバー境界
      - 'apps/product/src/features/*/server/**'
      - 'apps/product/src/lib/trpc/**'
      - 'apps/product/src/lib/rate-limit/**'
      - 'apps/product/src/app/api/**'
      - 'apps/web/src/app/api/**'
      # env 契約・送信境界
      - 'apps/product/src/env.ts'
      - 'apps/product/src/lib/email/**'
      # 課金
      - 'apps/product/src/lib/billing/**'
      - 'apps/product/src/lib/stripe/**'
      - 'packages/billing/**'
      # 時刻契約
      - 'apps/product/src/lib/time/**'
      - 'apps/product/src/lib/date/**'
  # ここに scripts/ai-review/** や本ファイル自身を入れない。DANGEROUS_PATH_PATTERNS に
  # 無いので workflow は起動するがスクリプトは即 return し、「走ったが何も見ていない」
  # green が出るだけで課金だけかかる。reviewer 自身の変更は contract test と、
  # 危険クラスと同時に触られた場合の contract-change 検出 step が守る。
  #
  # workflow_dispatch は置かない。dispatch event は pull_request payload を持たないため
  # base/head SHA も PR 番号も空になり、「起動するが diff 0 件・comment も出ない green」に
  # しかならなかった。PR 番号入力と SHA 解決の配管を足せば直せるが、一度も使われて
  # いない入口のために配管を増やさない。手動で見たい時はローカルで実行する:
  #   pnpm exec tsx scripts/ai-review/review.ts --force --base <sha> --head <sha>

# pull_request_target では github.ref が **どの PR でも base branch**（refs/heads/main）に
# なる。ref だけで group を作ると PR をまたいで cancel し合い、あとから走った PR だけが
# レビューされる。PR 番号を group に入れる（production-config-audit.yml と同型）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # sticky comment の upsert に使う。commit status を自分で publish する必要は無い
  # （pull_request_target でも job の check run は PR の statusCheckRollup に出る。
  # 2026-07-30 に PR #1760 で実測: production-config-audit の
  # `Audit Vercel metadata (trusted)` が CheckRun として出ている）。
  # したがって gate は job の exit code のままで、status publish 用の権限は不要。
  pull-requests: write

jobs:
  review:
    name: "\U0001F50D AI Review"
    # draft のうちは走らせない。`opened`(draft) と `ready_for_review` の両方で走ると、
    # 同じ head SHA に 2 本目の run が積まれ、`cancel-in-progress` で 1 本目が cancelled に
    # なる。`finish-branch.sh` は cancelled を failure として数えるため、あとから成功した
    # run があっても次の push までマージできなくなる（trigger の types のコメント参照）。
    # skip された job は failure / pending / success のどれにも数えられないので無害。
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # **review step の予算に加えて、その前段の時間を確保する。** job timeout は job 全体に
    # かかるため、checkout + setup が食った分だけ review step の 9 分が削られる。
    # 足りないと job ごと timed_out になり、`finish-branch.sh` は timed_out を failure として
    # 数えるので、script の fail-open（インフラ障害では PR を止めない）へ到達できない。
    #
    # 実測（2026-07-30、直近 5 run）: Set up job + checkout + setup action = 31-34 秒。
    # ただし pnpm store cache が miss すると install は分単位に伸びる。9 分 + 4 分の余裕を取る。
    # timeout-minutes は上限であって予約ではなく、課金は実測時間（job ごと切り上げ）なので、
    # 広く取っても通常 run のコストは変わらない（実測 total は 66-72 秒）。
    timeout-minutes: 13
    steps:
      # pull_request_target must execute only the trusted base revision, never PR code.
      # working tree（reviewer 本体・contract・添付 rules・setup action・lockfile）は
      # すべて base 版になる。PR の diff は working tree ではなく git object から
      # 「データ」として読む（review.ts の collectChanges が base...head しか見ない）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # base...head の diff を取るため、両端に到達できる履歴が要る。
          fetch-depth: 0
          persist-credentials: false

      # head SHA が object store に無いと、review.ts は base...HEAD（= base...base）を
      # 見て「危険クラス 0 件」で緑を返す。**レビューせずに green** が最悪の壊れ方なので
      # ここで fail-closed にする。private repo で fork PR が無いため fetch-depth: 0 が
      # PR の head branch も取るが、その前提が崩れた時に黙って通さない。
      - name: Verify the PR head revision is reachable
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error title=ai-review::PR の head SHA を解決できませんでした。"
            exit 1
          fi
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error title=ai-review::head SHA $HEAD_SHA に到達できません（diff を取得できないためレビューを中止します）。"
            exit 1
          fi

      - uses: ./.github/actions/setup

      # 監査対象の PR が監査契約そのものを書き換えていないか見る。trusted base 実行では
      # PR 側の reviewer 変更はこの run に影響しないが、**マージすれば以後の全 PR の
      # 監査契約が変わる**ため、危険クラスと同時に触られた場合は人間の確認を要求する。
      # docs/engineering/log/2026-07-26-ai-review-pipeline.md の「prompt.md の変更は
      # 専用 PR で行う」運用規律を機械化したもの。
      # 判定は base の working tree から `git diff` で取る。`gh api pulls/N/files` は
      # 3000 file 上限と API 障害という外部依存を持ち、どちらも「検出できないまま素通り」に
      # なる。`--name-status` の rename 行は `R100<TAB>old<TAB>new` なので、旧 path も
      # そのまま現れる（保護対象を移動して逃げられない）。
      #
      # 保護対象は「この job が実行するもの」に合わせる。reviewer 本体と workflow だけでは
      # 足りない: `./.github/actions/setup` はこの job が実行する composite action で、
      # `pnpm-workspace.yaml` の `allowBuilds` は install 時に走る build script の
      # allowlist。trusted base は**この run** を守るが、マージ後の run は守らないため、
      # 次の run 以降の実行内容を変える差分はここで人間の確認へ回す。
      # `pnpm-lock.yaml` / `package.json` は依存更新で頻繁に動き、危険クラスと同時に
      # 触られる正当な PR が多いので入れない（残余リスクは decision ログに記録した）。
      #
      # `core.quotePath=false` を付ける。既定では非 ASCII を含む path が
      # `"scripts/ai-review/\346\227\245.md"` のように quote されて先頭が `"` になり、
      # anchor が外れて検出漏れになる。
      - name: Detect reviewer contract changes
        id: contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files=$(git -c core.quotePath=false diff --name-status "$BASE_SHA...$HEAD_SHA")
          if grep -Eq '(^|[[:space:]"])(scripts/ai-review/|\.github/actions/|\.github/workflows/ai-review\.yml([[:space:]"]|$)|pnpm-workspace\.yaml([[:space:]"]|$))' <<<"$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # contract が変わっていても reviewer 自体は実行する。動くのは base 版なので安全で、
      # 危険クラス diff への所見は人間の確認材料としてそのまま有用。判定だけ下で上書きする。
      - name: Review dangerous-class diff
        id: review
        # **script の締め切りより外、job の timeout-minutes より内で切る。**
        # review.ts は per-attempt の signal を残り予算で clamp するので、自分から
        # TOTAL_DEADLINE_MS(8 分) 以内に諦めて fail-open の exit 0 を返す。
        # ここを 8 にすると script が諦める瞬間と同時に step が kill され、
        # 「インフラ障害では PR を止めない」設計が red へ反転する。1 分の余裕を置く。
        # contract test が TOTAL_DEADLINE_MS < この値 < job timeout を固定している。
        timeout-minutes: 9
        run: |
          set +e
          pnpm exec tsx scripts/ai-review/review.ts
          review_exit=$?
          set -e
          echo "exit_code=$review_exit" >> "$GITHUB_OUTPUT"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # model id は provider 側で改称されうるため repo variable で上書きできる。
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # github.sha への fallback を置かない。pull_request_target では github.sha が
          # **base branch の先端**なので、fallback が効くと base...base の空 diff を
          # 「危険クラス 0 件」と読んで緑になる。未解決なら上の step で落とす。
          AI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          # 「意図しない cascade delete」は意図が分からないと判定できない。作者の申告を
          # 渡し、diff との食い違いを見せる。env 経由で渡すのは script 内へ直接展開しない
          # ため（${{ }} を run の shell に置くと本文が command として解釈されうる）。
          # prompt 側では「信頼できない参考情報」として明示的に区切る。
          AI_REVIEW_PR_TITLE: ${{ github.event.pull_request.title }}
          AI_REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          # 誤検出だと人間が判断した時の逃げ道。`ai-review:override` ラベルが付いた PR は
          # 所見があっても check を落とさない。blocking な gate には必ず逃げ道が要る。
          AI_REVIEW_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # **既定は blocking**（script 側で AI_REVIEW_ENFORCE !== 'false' を既定にしている）。
          # 観察モードへ戻すには repo variable に明示的に false を置く。安全側を既定にし、
          # 緩める側を明示操作にする。ここで渡さないと切り替え不能になる。
          AI_REVIEW_ENFORCE: ${{ vars.AI_REVIEW_ENFORCE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # gate は job の exit code。review step が skip された経路（checkout / head 到達性 /
      # setup / contract 検出のいずれかが落ちた場合）では output が空になるため、既定を
      # `1` にして fail-closed へ倒す。
      #
      # run の cancel と job timeout ではこの step ごと skip されるが、その場合は job の
      # check run が cancelled として PR に出る。finish-branch.sh は cancelled / timed_out を
      # failure として数えるため（scripts/git/finish-branch.sh の失敗判定）、
      # 「痕跡が無いまま素通り」にはならない。
      - name: Enforce review result
        if: ${{ !cancelled() }}
        env:
          REVIEW_EXIT: ${{ steps.review.outputs.exit_code || '1' }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed || 'false' }}
          # 監査契約を意図的に変更し、人間がレビュー済みだと判断した時の逃げ道。
          # `ai-review:override` は review.ts 側の「所見の誤検出」用なので分けている
          # （契約変更の承認と所見の棄却は別の判断）。
          # **ラベルは付けた後の push で効く。** ラベル付与での再発火は入れていない
          # （trigger の types のコメント参照）。
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            if printf '%s' "$PR_LABELS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -qx 'ai-review:contract-reviewed'; then
              echo "::warning title=ai-review::ai-review:contract-reviewed ラベルがあるため、監査契約の変更を許容します。"
            else
              echo "::error title=ai-review::この PR は scripts/ai-review/ または .github/workflows/ai-review.yml を変更しています。監査契約の変更は専用 PR で行ってください。束ねる判断をした場合は ai-review:contract-reviewed ラベルを付けてください。"
              exit 1
            fi
          fi
          exit "$REVIEW_EXIT"
