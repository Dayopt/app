name: Production Release

# main へ merge しても Production domain は自動で切り替わらない。
# Auto-assign Custom Production Domains を無効化した Product / Web に対し、
# このワークフローだけが「同一 SHA・両 project 成功」を確認して promote する。
# タグと GitHub Release は promote と観察が終わった後の証跡であり、deploy trigger ではない。
#
# 2026-08-20: push:main トリガーを廃止し、手動 workflow_dispatch のみへ切り替えた（#2268）。
# main への merge が Production domain の切り替えを自動で起動することはない。

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Release target commit SHA (40 hex). Defaults to the current ref.'
        required: false
      force:
        description: 'Break-glass Force Promote: skip smoke and Production Config Audit'
        type: boolean
        default: false
      reason:
        description: 'Required when force is enabled. Recorded in the commit status.'
        required: false
      simulate_failure:
        description: 'Drill only: smoke:<p> | promote:<p> | production-smoke:<p> (p = web | product)'
        required: false

permissions:
  contents: read
  statuses: write

concurrency:
  # 実行中の release は中断しない。中断すると片方だけ promote された状態が残りうる。
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote Production
    runs-on: ubuntu-latest
    # この environment に deployment branch policy（main のみ）を設定すると、
    # main 以外の ref からの dispatch は job 開始前に GitHub 側で拒否される。
    # policy 未設定の間は素通りするため、設定するまで残存リスクは閉じない。
    # 手順は docs/engineering/infra.md を参照。
    environment: production-release
    # scripts/production-release.mjs の WORST_CASE_RELEASE_MS を必ず上回ること。
    # 下回ると rollback の途中で job が kill され、片方だけ promote された
    # production が手動 rollback の手掛かりごと失われる。
    # scripts/__tests__/release-workflow-contract.test.ts が不等式を守る。
    timeout-minutes: 80
    steps:
      # 実行する workflow / script は常に dispatch した ref のものを使う。
      # inputs.sha は release 対象を指す data であって、実行するコードではない。
      # ref に渡すと、未 merge の commit が持つ script を Production 権限で走らせられる。
      #
      # 残存リスク: main 以外の ref から dispatch すると、その ref の script が
      # Production secret 付きで動く。これは YAML の if では塞げず、environment の
      # deployment branch policy でしか閉じられない（infra.md に手順を記載）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 影響判定は「各 project が今配信している SHA → target SHA」の git diff で
          # 行う。既定の shallow clone では過去の production SHA が checkout に無く、
          # 判定が毎回 fail closed（= 常に両 project affected）へ落ちる。
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require a reason for Force Promote
        if: inputs.force
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$REASON" ]; then
            echo "::error::Force Promote requires a reason. Record it here and in the ops log."
            exit 1
          fi

      - name: Resolve and validate release SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release target must be a 40 character commit SHA"
            exit 1
          fi

          # 常に main 包含を確認する。push:main 廃止（#2268）前は github.sha が
          # main 上の commit である push イベントでしか埋まらなかったため、
          # 人が渡した sha だけを検証していた。workflow_dispatch は任意 ref から
          # 起動できるため、sha 未指定時の github.sha（= dispatch した ref の
          # tip）も main 以外を指しうる。無条件化しないと、main 以外の ref から
          # sha 省略で dispatch した場合にこの検証が丸ごと素通りする。
          #
          # `main` という名の tag との曖昧さを避けるため heads/main で明示する。
          # 404 なら gh が非 0 終了し、代入が set -e に拾われて fail closed になる
          # （`export status=$(...)` にすると壊れるので前置しない）。
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/heads/main...$sha" --jq '.status')
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::Release target must already be merged into main (compare status: $status)"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # CI 4 層再設計（#2269）の層 4。E2E / Web E2E / Integration Tests は
      # per-PR から撤去され、層 3（heavy-post-merge.yml は nightly + 手動発火、
      # integration.yml はこれに加え paths 該当時の main push）だけが検証する。
      # promote 前にこの層 3 が target SHA で green だったことを確認しないと、
      # 壊れた main がそのまま Production へ昇格しうる。
      # force（break-glass）時はこの gate も既存の smoke/audit skip と同様にスキップする。
      - name: Verify heavy-tier (layer 3) checks are green
        if: '!inputs.force'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          # target SHA に対する check-runs を取得し、層 3 の 3 check（E2E / Web E2E /
          # Integration Tests）がすべて success であることを要求する。取得失敗・
          # 見つからない・pending はすべて fail closed（停止）に倒す。
          # #2382（2026-08-25）で heavy-post-merge.yml の push:main トリガーを廃止し、
          # 層 3 は nightly + 手動発火（+ integration.yml のみ paths 該当時の
          # main push）へ変わった。つまり main HEAD が「直近の層 3 実行 SHA」より
          # 進んでいる（nightly 後に追加の merge があった）のは通常運用で起こりうる。
          # この gate は target SHA ちょうどの check-runs しか見ないため、その場合は
          # ここで fail closed に停止する。
          #
          # 対処は .claude/skills/releasing/SKILL.md Phase 1.2 の手動発火手順:
          # **main HEAD に対して**層 3 を dispatch し、その run の headSha を
          # この workflow の `sha` input へ渡して promote する。
          #
          # main HEAD 以外（層 3 が走っていない過去 SHA）を promote したい時は、
          # その SHA へ一時 tag を打って `--ref <tag>` で dispatch する。
          # `gh workflow run --ref` は 40-hex SHA を HTTP 422 で拒否するが
          # **tag は受け付ける**（2026-08-25 実測。tag ref の run は headSha が
          # tag 先の commit になり、check-run もその commit へ付く。本 gate は
          # `commits/$RELEASE_SHA/check-runs` を見るので ref の種類に依存しない）。
          # tag ref は concurrency group も main と別になるため、走行中の
          # main run を巻き込まない。
          # したがって **実テストを走らせる道は常に残っており、force は最後の
          # 手段**（force は本 gate だけでなく smoke と Production Config Audit
          # も同時に skip する）。
          required_checks=("🎭 E2E Tests" "🌐 Web Build & E2E" "Integration Tests")

          runs_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq '.check_runs[] | {name, status, conclusion, started_at}' | jq -s '.')"

          if [ -z "$runs_json" ] || [ "$runs_json" = "[]" ]; then
            echo "::error::target SHA の check-runs を取得できませんでした（0 件）。.claude/skills/releasing/SKILL.md Phase 1.2 の手順で層 3 を手動発火し、その run の headSha を sha input へ渡して再実行してください（force は smoke と Production Config Audit も同時に skip する最終手段）。"
            exit 1
          fi

          fail=0
          for name in "${required_checks[@]}"; do
            # 同名 check-run が複数（再実行）ある場合は started_at が最新のものを代表とする。
            conclusion="$(printf '%s' "$runs_json" | jq -r --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.started_at // "") | .[-1].conclusion // "missing"')"
            if [ "$conclusion" != "success" ]; then
              echo "::error::layer 3 check \"$name\" is not green (conclusion=$conclusion)"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::promote を停止しました。層 3（nightly + 手動発火の重量テスト）が target SHA で green ではありません。.claude/skills/releasing/SKILL.md Phase 1.2 の手順で層 3 を手動発火し、その run の headSha を sha input へ渡して再実行してください。"
            exit 1
          fi

      - name: Wait, smoke, and promote Production
        id: release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # GitHub keeps the existing VERCEL_ORG_ID replica; the runtime contract
          # uses the canonical 1Password/schema name VERCEL_TEAM_ID.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          # Deployment Protection guards candidate unique URLs, so smoke needs
          # each project's Protection Bypass for Automation secret.
          VERCEL_BYPASS_PRODUCT: ${{ secrets.VERCEL_AUTOMATION_BYPASS_PRODUCT }}
          VERCEL_BYPASS_WEB: ${{ secrets.VERCEL_AUTOMATION_BYPASS_WEB }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_FORCE: ${{ inputs.force }}
          # 2026-08-05 に段階適用が完了（両 project の Auto-assign Custom Production
          # Domains を無効化。#1817 の project 設定監査が「'' のまま放置され、live が
          # true に固定されていた」未完了状態を検出したのを受けて実施）。'false' 宣言
          # により release は run 開始時点の値ではなく false を expected として掃く。
          RELEASE_EXPECT_AUTO_ASSIGN: 'false'
          RELEASE_SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure || '' }}
          # project ごとに live SHA が分かれうるため、「この run の後どこが何を配信
          # しているか」を artifact に残す。部分失敗の復旧で一次情報になる。
          RELEASE_MANIFEST_PATH: release-manifest.json
        run: |
          set +e
          node scripts/production-release.mjs
          release_exit=$?
          set -e
          echo "exit_code=$release_exit" >> "$GITHUB_OUTPUT"

      # SHA が解決できていない場合は publish しない。空の SHA へ POST すると
      # 404 で step が落ちるだけで、何の情報も残らない。
      - name: Publish Production Release status
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXIT: ${{ steps.release.outputs.exit_code || '1' }}
          RELEASE_STATUS: ${{ steps.release.outputs.release_status || 'failed' }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          FORCED: ${{ inputs.force }}
          REASON: ${{ inputs.reason }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to publish status for an invalid commit SHA"
            exit 1
          fi

          if [ "$RELEASE_EXIT" != "0" ]; then
            state=failure
            description="Release gate stopped before or during promote; see the run summary"
            if [ "$FORCED" = "true" ]; then
              description="Force Promote failed: $REASON"
            fi
          elif [ "$RELEASE_STATUS" = "superseded" ]; then
            # promote は 1 件も行われていない。この commit は live ではないので
            # success を出すと create-release.yml の gate を素通りしてしまう。
            state=failure
            description="Superseded: a newer deployment already serves Production"
          elif [ "$RELEASE_STATUS" = "unaffected" ]; then
            # どの app の build 入力も変わらない merge（docs / CI 設定など）。
            # Production の artifact はこの commit と等価なので tag を許可する。
            state=success
            description="No app impact; Production already serves an equivalent build"
          else
            state=success
            description="Production serves this commit"
            if [ "$FORCED" = "true" ]; then
              description="Force Promote: $REASON"
            fi
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" \
            -f context="Production Release" \
            -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Upload release manifest
        if: always()
        # **status publish の後に置く。** script の最終検証と status publish の間に
        # step を挟むと、その間の外部 promote を誰も見ないまま success が出る。
        # また診断用 artifact であって gate ではないので、失敗が status と食い違わない
        # よう non-gating にする（script 側の書き込み失敗を握るのと同じ扱い）。
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run attempt ごとに分ける。re-run（同一 run 内の再試行）は同名 artifact を
          # 2 度 upload できず失敗するため、re-run 時に手動 rollback の一次情報である
          # manifest が 1 つも残らない事故を防ぐ。
          name: release-manifest-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Enforce release result
        if: always()
        env:
          RELEASE_EXIT: ${{ steps.release.outputs.exit_code || '1' }}
          RELEASE_STATUS: ${{ steps.release.outputs.release_status || 'failed' }}
        run: |
          if [ "$RELEASE_EXIT" != "0" ]; then
            exit "$RELEASE_EXIT"
          fi
          if [ "$RELEASE_STATUS" = "superseded" ]; then
            echo "::error::Target SHA is not live; a newer Production deployment already serves Production."
            exit 1
          fi
          exit 0
