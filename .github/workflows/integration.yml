name: Integration Tests

# CI 4 層再設計（#2269）で per-PR（pull_request）トリガーを撤去し、
# main push 後 + nightly の層 3 へ移した。旧 push:main 廃止（2026-08-03 実測で
# PR 検証と同一 tree の再検証だったため）の判断は、per-PR 実行そのものが
# 前提だった。前提が変わった（per-PR では走らせない）ため、push:main を
# 「main 上で唯一の検証機会」として復活させる。paths は旧 pull_request.paths と
# 同一を維持し、無関係な merge での実行を避ける。
on:
  push:
    branches: [main]
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/product/package.json'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/integration.yml'
      - 'apps/product/src/features/*/domain/**'
      - 'apps/product/src/features/*/server/**'
      - 'packages/domain/**'
      - 'apps/product/src/lib/database/**'
      - 'apps/product/src/lib/mcp/**'
      - 'apps/product/src/lib/oauth-server/**'
      - 'apps/product/src/lib/supabase/**'
      - 'apps/product/src/lib/trpc/**'
      - 'apps/product/src/app/api/mcp/**'
      - 'supabase/migrations/**'
      - 'apps/product/src/lib/test/integration/**'
      - 'apps/product/src/lib/test/integration-setup.ts'
      - 'apps/product/src/lib/test/trpc-test-helpers.ts'
      - 'apps/product/vitest.config.integration.ts'
      - 'scripts/generate-rls-snapshot.ts'
      - 'docs/engineering/data/db/rls-snapshot.md'
  schedule:
    # 06:45 JST。production-config-audit（06:00）・replica-check（06:30）と
    # 時間をずらし、同時実行の Supabase / 外部 API 呼び出し衝突を避ける。
    - cron: '45 21 * * *'
  # paths は workflow_dispatch には書けない（inputs しか受け付けない）。手動実行は
  # 常に全実行になる。
  workflow_dispatch:

# ここに Supabase の Management API token を置かない。integration test は
# `supabase start` のローカル stack だけを使い、cloud へは触らないので token は
# 不要（2026-08-11 に vestigial と確認して削除）。production の Auth 設定を読む
# audit は production-config-audit.yml の auth-config job が担う。

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    # pull_request トリガー撤去（層 3 化）に伴い draft 判定は不要になった。
    # push:main / schedule / workflow_dispatch はいずれも pull_request context を
    # 持たないため、job 自体は常に実行される。
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - id: supabase-version
        run: |
          version=$(node -p "require('./apps/product/package.json').devDependencies.supabase")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # package.json の Supabase CLI と同じバージョンを使い、ローカルと CI の挙動を揃える
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
          USE_LOCAL_DB: 'true'
          NODE_ENV: test
          CI: true

      # migration から構築した DB の RLS が、committed snapshot と一致するか検証する。
      # drift（migration 変更で snapshot 未更新）を CI で検出する。更新は `pnpm rls:snapshot`。
      - name: Check RLS snapshot drift
        run: pnpm rls:snapshot:check
        env:
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}

      - name: Stop Supabase
        if: always()
        run: supabase stop
