name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/**'
      - 'src/features/*/services/**'
      - 'src/platform/supabase/**'
      - 'supabase/migrations/**'
      - 'src/test/integration/**'
  push:
    branches: [main]
    paths:
      - 'src/server/**'
      - 'src/features/*/services/**'
      - 'src/platform/supabase/**'
      - 'supabase/migrations/**'
      - 'src/test/integration/**'

env:
  NODE_VERSION: '22'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          # supabase/setup-cli@v2 は `supabase_linux_amd64.tar.gz` を期待するが v2.99.0+ から
          # asset 名が `supabase_${version}_linux_amd64.tar.gz` に変わって 404 になるため
          # 旧 asset 形式を持つ最終 version (2.98.0) に pin する
          version: 2.98.0

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
          NODE_ENV: test
          CI: true

      - name: Stop Supabase
        if: always()
        run: supabase stop
