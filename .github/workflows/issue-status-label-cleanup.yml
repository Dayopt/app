name: Issue Status Label Cleanup

# close済みissueに status:* ラベルが残留し、着手可否ラベルの意味と矛盾する
# 事故（487件残留、2026-08-27実測）の再発防止（#2440）。close イベントの
# たびにその issue の status:* prefix ラベルだけを機械的に剥がす。
#
# judgment:diverged / judgment:judged は対象外（`dispatch` skill（旧 orchestration.md、#2479 で再編）
# §判断ジャーナル。close済みでもラベルを残す設計）。剥がし判定は
# scripts/ci/strip-status-labels.mjs の selectStatusLabelsToStrip が
# status: prefixへの完全一致でのみ行うため、他 prefix には構造的に触れない
# （契約は scripts/ci/strip-status-labels.test.ts が固定する）。
#
# reopen された issue への status ラベル付け直しはこの workflow の対象外
# （`dispatch` skill（旧 orchestration.md、#2479 で再編） 起票時の推奨どおり、reopen 理由によって
# 適切な status が変わるため機械では決められない。手動で付け直す）。

on:
  issues:
    types: [closed]

concurrency:
  group: issue-status-label-cleanup-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  strip-status-labels:
    name: close済みissueのstatus:*ラベルを剥がす
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: status:* ラベルを剥がす
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ci/strip-status-labels.mjs on-close "$ISSUE_NUMBER"
