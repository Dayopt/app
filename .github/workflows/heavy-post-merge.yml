name: Heavy Tests (post-merge)

# CI 4 層再設計（#2269）の層 3。E2E / Web E2E は per-PR（層 1・2）から撤去し、
# ここへ移設した。per-PR で毎 push 走らせるコストが private 化後の Actions 無料枠
# （2,000 分/月）を圧迫するため、「main へ merge された後に検証する」安全網へ変更する。
# レーンのローカル影響 spec 実走義務（.claude/rules/lane-protocol.md §条件付き事前 E2E）が
# per-PR 検出の主力を引き継ぐ。
#
# job 定義（checkout / setup / playwright install / supabase start / test 実行 /
# artifact upload）は .github/workflows/ci.yml の旧 e2e / web job から無変更で移設した。
# check 名（"🎭 E2E Tests" / "🌐 Web Build & E2E"）も維持する。release.yml の層 4
# pre-flight（promote 前 gate）と scripts/git/finish-branch.sh の rollup 判定が
# 参照する context/check 名は不変であることに依存しない設計（ruleset の
# required_status_checks から外れるため finish-branch.sh には影響しない）だが、
# release.yml 側は check-runs API でこの名前を直接参照する。

on:
  push:
    branches: [main]
  schedule:
    # 08:00 JST。production-config-audit（06:00）・replica-check（06:30）・
    # storage-backup-export（07:00）と時間をずらし、同時実行の外部 API 呼び出し
    # 衝突を避ける。
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: heavy-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: "\U0001F3AD E2E Tests"
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - id: supabase-version
        run: |
          version=$(node -p "require('./apps/product/package.json').devDependencies.supabase")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # package.json の Supabase CLI と同じバージョンを使い、ローカルと CI の挙動を揃える
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: pnpm --dir apps/product exec playwright test --project="chromium"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_e2e_dummy

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/product/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: apps/product/test-results/
          retention-days: 7

  web:
    name: "\U0001F310 Web Build & E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.{ts,tsx}', 'apps/web/content/**/*.{md,mdx,json}') }}
          restore-keys: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build web
        run: pnpm build:web

      - name: Install Playwright browser
        run: pnpm --filter @dayopt/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run web E2E tests
        run: pnpm --filter @dayopt/web test:e2e:smoke

      - name: Upload web report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload web test results on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-test-results
          path: apps/web/test-results/
          retention-days: 7
