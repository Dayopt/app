name: Production Config Audit

# この audit が見るのは Vercel 側の状態（env 構成の drift）であって PR の diff では
# ない。よって発火は「merge 前（ready 後の PR）・merge 時（push:main）・日次 cron」で
# 足りる。draft の反復 push で毎回 Vercel API を叩く必要はない（2026-08-03、
# 実測 3 日 74 run の削減）。contract 変更検出は ready_for_review でも発火するため、
# draft の間に contract を書き換えても ready 化の時点で必ず捕まる。
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # 06:00 JST。merge が無い日でも dashboard 手動変更の drift を 1 日以内に検出する
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: production-config-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Vercel metadata (trusted)
    # draft の間は走らせない。skip は conclusion: skipped の check run になり、
    # finish-branch.sh の畳み込みが「判定を持つ entry を優先」で処理する（ci.yml の重量 job と同型）。
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target must execute only the trusted base revision, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect audit contract changes
        id: contract
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check both sides of a rename so a protected contract cannot evade
          # the trusted-head checkpoint by moving to a new path.
          #
          # production-auth-config-audit.mjs is deliberately NOT protected here: it
          # never runs in a PR or dispatch context (see the auth-config job), so a PR
          # editing it cannot produce a misleading green from a base-revision run.
          # Forcing a trusted dispatch for it would add friction without verification,
          # because the dispatch skips that job by design.
          changed_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$changed_files" | grep -Eq '^(scripts/production-config-audit\.mjs|apps/product/production-build-gate\.mjs|apps/web/production-build-gate\.mjs|\.github/workflows/production-config-audit\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit Vercel environment metadata
        id: audit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # GitHub keeps the existing VERCEL_ORG_ID replica; the runtime contract
          # uses the canonical 1Password/schema name VERCEL_TEAM_ID.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set +e
          node scripts/production-config-audit.mjs
          audit_exit=$?
          set -e
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"

      - name: Publish Production Config Audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code || '1' }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            state=failure
            description="Audit contract changed; trusted head audit is required"
          elif [ "$AUDIT_EXIT" = "0" ]; then
            state=success
            description="Vercel metadata matches the Production contract"
          else
            state=failure
            description="Vercel metadata does not match the Production contract"
          fi

          shas=()
          if [ -n "$PR_NUMBER" ]; then
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
            merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merge_commit_sha // empty')
            shas+=("$head_sha")
            if [ -n "$merge_sha" ] && [ "$merge_sha" != "$head_sha" ]; then
              shas+=("$merge_sha")
            fi
          else
            shas+=("$GITHUB_SHA")
          fi

          for sha in "${shas[@]}"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Refusing to publish status for an invalid commit SHA"
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" \
              -f context="Production Config Audit" \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          done

      - name: Enforce audit result
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code || '1' }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed || 'false' }}
        run: |
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            exit 1
          fi
          exit "$AUDIT_EXIT"

  # Supabase Auth の enforcement 値の drift 検出（#1926）。Vercel の audit と分けて
  # いる理由は 2 つ。
  #
  # 1. **token を branch code へ渡さない。** Supabase Management API の PAT は account
  #    単位 read-write で、Vercel token（deploy / env metadata）より blast radius が広い。
  #    上の job は `pull_request_target`（base.sha を checkout）に加えて
  #    `workflow_dispatch --ref <branch>`（**branch head を checkout**）でも走り、後者は
  #    trusted dispatch の運用上ほぼ毎回使われる。PAT をそこへ乗せない。
  # 2. **merge gate を巻き込まない。** commit status「Production Config Audit」は
  #    finish-branch.sh が解除判定に使う。auth 設定の drift は PR の diff と無関係
  #    （Dashboard 由来）なので、これを status に載せると無関係な全 PR の merge が止まる。
  #
  # 検出経路は push:main（merge 直後）と日次 cron。失敗は workflow failure として
  # 通知される。手元での単発確認は `op run` 経由の CLI 実行
  # （`docs/operations/security/environment-secrets.md` §Supabase Auth config）。
  auth-config:
    name: Audit Supabase Auth config (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # secret 名は `SUPABASE_ACCESS_TOKEN` と分ける。同名だと、別 workflow が
      # 「その名前の secret を参照するだけ」で PR code の実行経路へ token が配られる
      # （integration.yml がまさにその形の env を持っていた）。名前を分けておけば、
      # audit 用 token の配布先はこの step だけに閉じる。
      #
      # 出力の grep は positive proof。CLI guard が何らかの理由で発火しないと
      # 「何も実行せず exit 0」になり、audit が静かに死ぬ。
      - name: Audit Supabase Auth enforcement values
        env:
          SUPABASE_AUTH_AUDIT_TOKEN: ${{ secrets.SUPABASE_AUTH_AUDIT_TOKEN }}
        run: |
          set -o pipefail
          node scripts/production-auth-config-audit.mjs | tee audit-output.txt
          grep -q 'Production Auth Config Audit passed' audit-output.txt

  # production デプロイの成否そのものを検知する経路が repo に無かった（#2121, #2124）。
  # PR の「Vercel – product」check は preview デプロイの結果、上の audit job は env
  # metadata の drift のみ、UptimeRobot は稼働中の（古い）デプロイの healthy 状態しか
  # 見ないため、いずれも「新しい deploy が失敗して古いデプロイのまま止まっている」ことを
  # 区別できなかった（2026-08-14〜17、3〜4 日間気づかれず main の merge が production に
  # 未反映のまま停滞した実績あり）。auth-config job と同じ理由（push:main / 日次 cron の
  # みで足り、PR の merge gate には巻き込まない）で分離する。
  deploy-health:
    name: Check production deploy health (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # commit status / issue 本文の参照用（health 判定そのものには使わない。
      # scripts/production-config-audit.mjs の evaluateProductionDeploymentHealth の
      # コメント参照: ignoreCommand による意図的スキップと区別できないため main HEAD
      # SHA との一致は判定条件にしない）。
      - name: Determine main HEAD SHA
        id: main_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check production deployment health
        id: deploy_health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set +e
          node scripts/production-config-audit.mjs --deploy-health
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Publish Production Deploy Health status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.deploy_health.outputs.exit_code || '1' }}
          SHA: ${{ steps.main_head.outputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to publish status for an invalid commit SHA"
            exit 1
          fi

          if [ "$EXIT_CODE" = "0" ]; then
            state=success
            description="Latest production deployment is READY"
          else
            state=failure
            description="Latest production deployment is unhealthy (see run log)"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context="Production Deploy Health" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      # 失敗のたびに新規 issue を乱造しない。既存の未クローズ自動起票 issue があれば
      # コメントで追記するだけにする（title prefix で判定、dedupe 用の専用ラベルは
      # 増やさず既存の area:deployment で絞り込む）。
      - name: File or update incident issue on unhealthy production deployment
        if: always() && steps.deploy_health.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.main_head.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_prefix="[auto] production デプロイが unhealthy です"
          body="production target の最新デプロイが READY ではありません（ERROR / grace period 超過の BUILDING 停滞のいずれか）。検知時点の main HEAD: \`$SHA\`。詳細ログ: $RUN_URL

          このコメントは \`production-config-audit.yml\` の \`deploy-health\` job による自動起票/追記です。詳細: \`docs/operations/log/2026-08-17-incident-production-deploy-freeze.md\`"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "area:deployment" --state open --json number,title \
            --jq --arg prefix "$title_prefix" '[.[] | select(.title | startswith($prefix))][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title_prefix" \
              --label "area:deployment,area:operations,priority:p1" \
              --body "$body"
          fi

      - name: Enforce deploy health result
        if: always()
        env:
          EXIT_CODE: ${{ steps.deploy_health.outputs.exit_code || '1' }}
        run: exit "$EXIT_CODE"
