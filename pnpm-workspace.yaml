packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
overrides:
  tar: '^7.5.4'
  tmp: '^0.2.4'
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'
  # security: Dependabot alerts解消 (#1569)
  # 同一 major に閉じる `^` で上限を付け、意図せぬメジャー更新を防ぐ
  hono: '^4.12.25'
  dompurify: '^3.4.11'
  esbuild: '^0.28.1'
  'js-yaml@4.1.1': '^4.2.0'
  'postcss@8.4.31': '^8.5.16'
  '@babel/core@7.29.0': '^7.29.7'
  # upstream が修正版を取り込むまで、脆弱な間接依存だけを置換する (#1569)
  'sharp@<0.35.0': '^0.35.3'
  'valibot@1.2.0': '^1.4.2'
  'js-yaml@3.14.2': '3.15.0'
  'uuid@8.3.2': '11.1.1'
